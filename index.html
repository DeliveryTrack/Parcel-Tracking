<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GiftHub Parcel Tracking</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
  <div class="brand">🎁 GiftHub</div>
  <h1>Parcel Tracking</h1>
  <p class="subtitle">Enter your registered mobile number to track your handwriting parcel.</p>

  <div class="track-box">
    <label for="mobile">Mobile Number</label>
    <input id="mobile" type="tel" maxlength="10" placeholder="Enter 10 digit mobile number">
    <button onclick="trackParcel()">Track Parcel</button>
    <p id="message"></p>
  </div>

  <div id="result" class="result hidden"></div>
</div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
